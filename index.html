<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#20232a">

    <meta name="description"
          content="A modern calculator with symbols, history and dark mode">

    <link rel="manifest" href="manifest.json">

    <title>My Calculator</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background: #e9edf5;
            color: #111;

            transition: 0.3s;
        }

        body.dark {
            background: #101114;
            color: white;
        }

        .app {
            width: 100%;
            max-width: 430px;
            padding: 15px;
        }

        .calculator {
            background: white;
            padding: 18px;
            border-radius: 25px;

            box-shadow:
                0 15px 40px rgba(0,0,0,0.18);

            transition: 0.3s;
        }

        body.dark .calculator {
            background: #20232a;
        }

        /* HEADER */

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 12px;
        }

        .title {
            font-size: 22px;
            font-weight: bold;
        }

        .theme-btn {
            width: 50px;
            min-height: 42px;
            padding: 0;
        }

        /* DISPLAY */

        .display {
            width: 100%;
            min-height: 90px;

            padding: 18px;

            border-radius: 16px;

            background: #111318;
            color: white;

            font-size: 32px;
            text-align: right;

            overflow-wrap: anywhere;

            margin-bottom: 12px;
        }

        /* BUTTONS */

        button {
            border: none;

            min-height: 55px;

            border-radius: 14px;

            font-size: 18px;
            font-weight: bold;

            cursor: pointer;

            background: #e7e9ed;
            color: #111;

            transition: 0.12s;
        }

        button:hover {
            filter: brightness(0.92);
        }

        button:active {
            transform: scale(0.94);
        }

        body.dark button {
            background: #343943;
            color: white;
        }

        /* TOOLS */

        .tools {
            display: grid;

            grid-template-columns:
                1fr 1fr 1fr;

            gap: 8px;

            margin-bottom: 10px;
        }

        /* MAIN CALCULATOR */

        .main-buttons {
            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 8px;
        }

        .operator {
            background: #ff9500 !important;
            color: white !important;
        }

        .equal {
            background: #2196f3 !important;
            color: white !important;
        }

        .clear {
            background: #e53935 !important;
            color: white !important;
        }

        /* SYMBOLS */

        .symbol-area {
            display: none;

            margin-top: 12px;
        }

        .symbol-area.show {
            display: block;
        }

        .symbol-title {
            text-align: center;

            font-size: 14px;

            margin-bottom: 8px;
        }

        .symbols {
            display: grid;

            grid-template-columns:
                repeat(5, 1fr);

            gap: 6px;
        }

        .symbol {
            min-height: 45px;
            font-size: 16px;
        }

        /* HISTORY */

        .history-box {
            margin-top: 15px;
        }

        .history-header {
            display: flex;

            justify-content: space-between;
            align-items: center;

            margin-bottom: 8px;
        }

        .history-title {
            font-size: 18px;
            font-weight: bold;
        }

        .clear-history {
            min-height: 38px;
            padding: 5px 12px;

            font-size: 13px;

            background: #e53935 !important;
            color: white !important;
        }

        .history {
            max-height: 180px;

            overflow-y: auto;

            border-radius: 12px;

            background: #f1f2f4;
        }

        body.dark .history {
            background: #15171b;
        }

        .history-item {
            padding: 10px 12px;

            border-bottom:
                1px solid #ccc;

            cursor: pointer;
        }

        body.dark .history-item {
            border-bottom-color: #333;
        }

        .history-item:last-child {
            border-bottom: none;
        }

        .history-expression {
            font-size: 13px;
            opacity: 0.7;
        }

        .history-result {
            font-size: 18px;
            font-weight: bold;
        }

        .empty-history {
            padding: 15px;

            text-align: center;

            opacity: 0.6;
        }

        /* INSTALL */

        .install-btn {
            width: 100%;

            margin-top: 12px;

            background: #673ab7 !important;
            color: white !important;
        }

        .install-btn.hidden {
            display: none;
        }

        /* MOBILE */

        @media (max-width: 450px) {

            .app {
                padding: 8px;
            }

            .calculator {
                padding: 12px;

                border-radius: 20px;
            }

            .display {
                font-size: 27px;
                min-height: 80px;
            }

            button {
                min-height: 52px;
            }

        }

    </style>
</head>

<body>

<div class="app">

    <div class="calculator">

        <!-- HEADER -->

        <div class="header">

            <div class="title">
                🔢 My Calculator
            </div>

            <button
                class="theme-btn"
                onclick="toggleTheme()"
                id="themeButton">
                🌙
            </button>

        </div>


        <!-- DISPLAY -->

        <div
            class="display"
            id="display">
            0
        </div>


        <!-- TOOLS -->

        <div class="tools">

            <button onclick="toggleSymbols()">
                🔣 Symbols
            </button>

            <button
                class="clear"
                onclick="clearDisplay()">
                C
            </button>

            <button onclick="backspace()">
                ⌫
            </button>

        </div>


        <!-- MAIN BUTTONS -->

        <div class="main-buttons">

            <button onclick="addValue('7')">7</button>
            <button onclick="addValue('8')">8</button>
            <button onclick="addValue('9')">9</button>

            <button
                class="operator"
                onclick="addValue('/')">
                ÷
            </button>


            <button onclick="addValue('4')">4</button>
            <button onclick="addValue('5')">5</button>
            <button onclick="addValue('6')">6</button>

            <button
                class="operator"
                onclick="addValue('*')">
                ×
            </button>


            <button onclick="addValue('1')">1</button>
            <button onclick="addValue('2')">2</button>
            <button onclick="addValue('3')">3</button>

            <button
                class="operator"
                onclick="addValue('-')">
                −
            </button>


            <button onclick="addValue('0')">
                0
            </button>

            <button onclick="addValue('.')">
                .
            </button>

            <button
                class="equal"
                onclick="calculate()">
                =
            </button>

            <button
                class="operator"
                onclick="addValue('+')">
                +
            </button>

        </div>


        <!-- SYMBOL KEYBOARD -->

        <div
            class="symbol-area"
            id="symbolArea">

            <div class="symbol-title">
                🔣 Symbol Keyboard
            </div>

            <div class="symbols">

                <button class="symbol"
                    onclick="addSymbol('@')">@</button>

                <button class="symbol"
                    onclick="addSymbol('!')">!</button>

                <button class="symbol"
                    onclick="addSymbol('#')">#</button>

                <button class="symbol"
                    onclick="addSymbol('$')">$</button>

                <button class="symbol"
                    onclick="addSymbol('%')">%</button>


                <button class="symbol"
                    onclick="addSymbol('^')">^</button>

                <button class="symbol"
                    onclick="addSymbol('&')">&amp;</button>

                <button class="symbol"
                    onclick="addSymbol('*')">*</button>

                <button class="symbol"
                    onclick="addSymbol('(')">(</button>

                <button class="symbol"
                    onclick="addSymbol(')')">)</button>


                <button class="symbol"
                    onclick="addSymbol('_')">_</button>

                <button class="symbol"
                    onclick="addSymbol('=')">=</button>

                <button class="symbol"
                    onclick="addSymbol('~')">~</button>

                <button class="symbol"
                    onclick="addSymbol('?')">?</button>

                <button class="symbol"
                    onclick="addSymbol('|')">|</button>


                <button class="symbol"
                    onclick="addSymbol('[')">[</button>

                <button class="symbol"
                    onclick="addSymbol(']')">]</button>

                <button class="symbol"
                    onclick="addSymbol('{')">{</button>

                <button class="symbol"
                    onclick="addSymbol('}')">}</button>

                <button class="symbol"
                    onclick="addSymbol(':')">:</button>


                <button class="symbol"
                    onclick="addSymbol(';')">;</button>

                <button class="symbol"
                    onclick="addSymbol(',')">,</button>

                <button class="symbol"
                    onclick="addSymbol('.')">.</button>

                <button class="symbol"
                    onclick="addSymbol('<')">&lt;</button>

                <button class="symbol"
                    onclick="addSymbol('>')">&gt;</button>

            </div>

        </div>


        <!-- HISTORY -->

        <div class="history-box">

            <div class="history-header">

                <div class="history-title">
                    🧮 History
                </div>

                <button
                    class="clear-history"
                    onclick="clearHistory()">
                    Clear
                </button>

            </div>

            <div
                class="history"
                id="history">
            </div>

        </div>


        <!-- INSTALL APP -->

        <button
            id="installButton"
            class="install-btn hidden">
            📲 Install Calculator
        </button>

    </div>

</div>


<script>

let expression = "";

const display =
    document.getElementById("display");

const symbolArea =
    document.getElementById("symbolArea");

const historyBox =
    document.getElementById("history");

const installButton =
    document.getElementById("installButton");

let deferredPrompt = null;


/* =========================
   CALCULATOR
========================= */

function updateDisplay() {

    display.innerText =
        expression || "0";

}


function addValue(value) {

    expression += value;

    updateDisplay();

}


function addSymbol(symbol) {

    expression += symbol;

    updateDisplay();

}


function clearDisplay() {

    expression = "";

    updateDisplay();

}


function backspace() {

    expression =
        expression.slice(0, -1);

    updateDisplay();

}


function calculate() {

    if (!expression.trim()) {
        return;
    }

    try {

        /*
        Only allow calculator characters
        for calculation.
        */

        if (!/^[0-9+\-*/().%\s]+$/.test(expression)) {
            throw new Error();
        }

        const result =
            Function(
                '"use strict"; return (' +
                expression +
                ')'
            )();

        if (!Number.isFinite(result)) {
            throw new Error();
        }

        addToHistory(
            expression,
            result
        );

        expression =
            String(result);

        updateDisplay();

    } catch {

        display.innerText = "Error";

        setTimeout(() => {
            updateDisplay();
        }, 1000);

    }

}


/* =========================
   SYMBOLS
========================= */

function toggleSymbols() {

    symbolArea.classList.toggle("show");

}


/* =========================
   DARK / LIGHT
========================= */

function toggleTheme() {

    document.body.classList.toggle("dark");

    const dark =
        document.body.classList.contains("dark");

    localStorage.setItem(
        "calculatorTheme",
        dark ? "dark" : "light"
    );

    document.getElementById(
        "themeButton"
    ).innerText =
        dark ? "☀️" : "🌙";

}


function loadTheme() {

    const theme =
        localStorage.getItem(
            "calculatorTheme"
        );

    if (theme === "dark") {

        document.body.classList.add("dark");

        document.getElementById(
            "themeButton"
        ).innerText = "☀️";

    }

}


/* =========================
   HISTORY
========================= */

function getHistory() {

    return JSON.parse(
        localStorage.getItem(
            "calculatorHistory"
        ) || "[]"
    );

}


function saveHistory(history) {

    localStorage.setItem(
        "calculatorHistory",
        JSON.stringify(history)
    );

}


function addToHistory(
    expressionText,
    result
) {

    let history = getHistory();

    history.unshift({

        expression: expressionText,

        result: result,

        time: new Date().toLocaleString()

    });

    /*
    Keep last 50 calculations
    */

    history =
        history.slice(0, 50);

    saveHistory(history);

    showHistory();

}


function showHistory() {

    const history =
        getHistory();

    if (history.length === 0) {

        historyBox.innerHTML =
            '<div class="empty-history">' +
            'No calculations yet' +
            '</div>';

        return;

    }

    historyBox.innerHTML =
        history.map((item, index) => {

            return `
                <div
                    class="history-item"
                    onclick="useHistory(${index})">

                    <div class="history-expression">
                        ${escapeHTML(item.expression)}
                    </div>

                    <div class="history-result">
                        = ${escapeHTML(String(item.result))}
                    </div>

                </div>
            `;

        }).join("");

}


function useHistory(index) {

    const history =
        getHistory();

    if (!history[index]) {
        return;
    }

    expression =
        String(history[index].result);

    updateDisplay();

}


function clearHistory() {

    localStorage.removeItem(
        "calculatorHistory"
    );

    showHistory();

}


function escapeHTML(text) {

    return text
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


/* =========================
   KEYBOARD
========================= */

document.addEventListener(
    "keydown",
    function(event) {

        const key = event.key;

        if (
            /^[0-9]$/.test(key) ||
            ["+", "-", "*", "/", ".", "(", ")"]
                .includes(key)
        ) {

            addValue(key);

            event.preventDefault();

            return;
        }


        if (key === "Enter" || key === "=") {

            calculate();

            event.preventDefault();

            return;
        }


        if (key === "Backspace") {

            backspace();

            event.preventDefault();

            return;
        }


        if (key === "Escape") {

            clearDisplay();

            event.preventDefault();

        }

    }
);


/* =========================
   PWA INSTALL
========================= */

window.addEventListener(
    "beforeinstallprompt",
    function(event) {

        event.preventDefault();

        deferredPrompt = event;

        installButton.classList.remove(
            "hidden"
        );

    }
);


installButton.addEventListener(
    "click",
    async function() {

        if (!deferredPrompt) {
            return;
        }

        deferredPrompt.prompt();

        await deferredPrompt.userChoice;

        deferredPrompt = null;

        installButton.classList.add(
            "hidden"
        );

    }
);


window.addEventListener(
    "appinstalled",
    function() {

        installButton.classList.add(
            "hidden"
        );

    }
);


/* =========================
   START
========================= */

loadTheme();

showHistory();

</script>

</body>
</html>
